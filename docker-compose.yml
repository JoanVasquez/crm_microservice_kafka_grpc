services:
  kafka:
    image: ${KAFKA_IMAGE}
    container_name: ${KAFKA_CONTAINER_NAME}
    ports:
      - "${KAFKA_CLIENT_HOST_PORT}:${KAFKA_CLIENT_PORT}"
      - "${KAFKA_CONTROLLER_HOST_PORT}:${KAFKA_CONTROLLER_PORT}"
    environment:
      KAFKA_NODE_ID: ${KAFKA_NODE_ID}
      KAFKA_PROCESS_ROLES: ${KAFKA_PROCESS_ROLES}
      KAFKA_CONTROLLER_QUORUM_VOTERS: ${KAFKA_NODE_ID}@${KAFKA_HOST}:${KAFKA_CONTROLLER_PORT}
      KAFKA_LISTENERS: PLAINTEXT://:${KAFKA_CLIENT_PORT},CONTROLLER://:${KAFKA_CONTROLLER_PORT}
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${KAFKA_HOST}:${KAFKA_CLIENT_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: ${KAFKA_LISTENER_SECURITY_PROTOCOL_MAP}
      KAFKA_CONTROLLER_LISTENER_NAMES: ${KAFKA_CONTROLLER_LISTENER_NAMES}
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: ${KAFKA_AUTO_CREATE_TOPICS_ENABLE}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR}
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: unless-stopped

  redis:
    image: ${REDIS_IMAGE}
    ports:
      - "${REDIS_HOST_PORT}:${REDIS_PORT}"
    command: redis-server --appendonly yes

  user-db:
    image: ${POSTGRES_IMAGE}
    environment:
      POSTGRES_DB: ${USER_DB_NAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${USER_DB_HOST_PORT}:${POSTGRES_PORT}"
    volumes:
      - user_db_data:/var/lib/postgresql/data

  product-db:
    image: ${POSTGRES_IMAGE}
    environment:
      POSTGRES_DB: ${PRODUCT_DB_NAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${PRODUCT_DB_HOST_PORT}:${POSTGRES_PORT}"
    volumes:
      - product_db_data:/var/lib/postgresql/data

  order-db:
    image: ${POSTGRES_IMAGE}
    environment:
      POSTGRES_DB: ${ORDER_DB_NAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${ORDER_DB_HOST_PORT}:${POSTGRES_PORT}"
    volumes:
      - order_db_data:/var/lib/postgresql/data

  api-gateway:
    build:
      context: .
      dockerfile: ./services/api-gateway/Dockerfile
    ports:
      - "${API_GATEWAY_HOST_PORT}:${API_GATEWAY_PORT}"
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=${API_GATEWAY_PORT}
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_HOST=${REDIS_HOST}
      - USER_SERVICE_HOST=${USER_SERVICE_HOST}
      - USER_SERVICE_PORT=${USER_SERVICE_PORT}
      - PRODUCT_SERVICE_HOST=${PRODUCT_SERVICE_HOST}
      - PRODUCT_SERVICE_PORT=${PRODUCT_SERVICE_PORT}
      - ORDER_SERVICE_HOST=${ORDER_SERVICE_HOST}
      - ORDER_SERVICE_PORT=${ORDER_SERVICE_PORT}
    depends_on:
      - redis
      - user-service
      - product-service

  user-service:
    build:
      context: .
      dockerfile: ./services/user-service/Dockerfile
    ports:
      - "${USER_SERVICE_HOST_PORT}:${USER_SERVICE_PORT}"
    environment:
      - NODE_ENV=${NODE_ENV}
      - GRPC_PORT=${USER_SERVICE_PORT}
      - DB_HOST=${USER_DB_HOST}
      - DB_PORT=${POSTGRES_PORT}
      - DB_USERNAME=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${USER_DB_NAME}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_URL=${REDIS_URL}
      - KAFKA_BROKERS=${KAFKA_BROKERS}
      - KAFKA_CLIENT_ID=${USER_SERVICE_KAFKA_CLIENT_ID}
      - KAFKA_GROUP_ID=${USER_SERVICE_KAFKA_GROUP_ID}
    depends_on:
      - user-db
      - redis
      - kafka

  product-service:
    build:
      context: .
      dockerfile: ./services/product-service/Dockerfile
    ports:
      - "${PRODUCT_SERVICE_HOST_PORT}:${PRODUCT_SERVICE_PORT}"
    environment:
      - NODE_ENV=${NODE_ENV}
      - GRPC_PORT=${PRODUCT_SERVICE_PORT}
      - DB_HOST=${PRODUCT_DB_HOST}
      - DB_PORT=${POSTGRES_PORT}
      - DB_USERNAME=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${PRODUCT_DB_NAME}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_URL=${REDIS_URL}
      - KAFKA_BROKERS=${KAFKA_BROKERS}
      - KAFKA_CLIENT_ID=${PRODUCT_SERVICE_KAFKA_CLIENT_ID}
      - KAFKA_GROUP_ID=${PRODUCT_SERVICE_KAFKA_GROUP_ID}
    depends_on:
      - product-db
      - redis
      - kafka

  order-service:
    build:
      context: .
      dockerfile: ./services/order-service/Dockerfile
    ports:
      - "${ORDER_SERVICE_HOST_PORT}:${ORDER_SERVICE_PORT}"
    environment:
      - NODE_ENV=${NODE_ENV}
      - GRPC_PORT=${ORDER_SERVICE_PORT}
      - DB_HOST=${ORDER_DB_HOST}
      - DB_PORT=${POSTGRES_PORT}
      - DB_USERNAME=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${ORDER_DB_NAME}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_URL=${REDIS_URL}
      - KAFKA_BROKERS=${KAFKA_BROKERS}
    depends_on:
      - order-db
      - redis
      - kafka

  prometheus:
    image: ${PROMETHEUS_IMAGE}
    ports:
      - "${PROMETHEUS_HOST_PORT}:${PROMETHEUS_PORT}"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"

  grafana:
    image: ${GRAFANA_IMAGE}
    ports:
      - "${GRAFANA_HOST_PORT}:${GRAFANA_PORT}"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana

  # ELK Stack
  elasticsearch:
    image: ${ELASTICSEARCH_IMAGE}
    environment:
      - discovery.type=${ELASTICSEARCH_DISCOVERY_TYPE}
      - xpack.security.enabled=${ELASTICSEARCH_SECURITY_ENABLED}
      - ES_JAVA_OPTS=${ELASTICSEARCH_JAVA_OPTS}
    ports:
      - "${ELASTICSEARCH_HOST_PORT}:${ELASTICSEARCH_PORT}"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

  logstash:
    image: ${LOGSTASH_IMAGE}
    ports:
      - "${LOGSTASH_HOST_PORT}:${LOGSTASH_PORT}"
    volumes:
      - ./monitoring/elk/logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    depends_on:
      - elasticsearch

  kibana:
    image: ${KIBANA_IMAGE}
    ports:
      - "${KIBANA_HOST_PORT}:${KIBANA_PORT}"
    environment:
      - ELASTICSEARCH_HOSTS=${ELASTICSEARCH_HOSTS}
    depends_on:
      - elasticsearch

  filebeat:
    image: ${FILEBEAT_IMAGE}
    user: root
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ./monitoring/elk/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - logstash

volumes:
  user_db_data:
  product_db_data:
  order_db_data:
  grafana_data:
  elasticsearch_data:
  kafka_data:
